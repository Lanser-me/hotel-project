<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>رزرو هتل آبشار</title>

    <style>
      /* تنظیمات کلی صفحه */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Tahoma, Arial, sans-serif;
        overflow-x: hidden;
      }

      /* =========================
           تصویر پس زمینه
        ========================= */

      .background-image {
        position: fixed;

        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        object-fit: cover;
        object-position: center;

        z-index: -2;
      }

      /* یک لایه خیلی کم‌رنگ روی تصویر */
      .background-overlay {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.12);

        z-index: -1;
      }

      /* =========================
           محل قرار گرفتن فرم
        ========================= */

      .page {
        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: flex-start;

        padding: 40px;
      }

      /* =========================
           فرم شیشه ای
        ========================= */

      form {
        width: 470px;

        max-width: 100%;

        padding: 30px;

        margin-right: auto;

        background: rgba(10, 20, 40, 0.38);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        border: 1px solid rgba(255, 255, 255, 0.45);

        border-radius: 25px;

        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.55),
          inset 0 0 30px rgba(255, 255, 255, 0.05);

        color: white;
      }

      /* =========================
           عنوان
        ========================= */

      h1 {
        text-align: center;

        margin-bottom: 8px;

        font-size: 28px;

        color: white;
      }

      /* توضیح زیر عنوان */

      .subtitle {
        text-align: center;

        margin-bottom: 25px;

        color: #eeeeee;

        font-size: 14px;
      }

      /* فاصله بین قسمت های فرم */

      .form-group {
        margin-bottom: 15px;
      }

      /* =========================
           برچسب ها
        ========================= */

      label {
        display: block;

        margin-bottom: 6px;

        font-size: 15px;

        color: white;

        font-weight: bold;
      }

      /* =========================
           ورودی ها
        ========================= */

      input,
      select {
        width: 100%;

        padding: 12px 14px;

        border: 2px solid rgba(255, 255, 255, 0.35);

        border-radius: 10px;

        background: rgba(255, 255, 255, 0.92);

        color: #222;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
      }

      /* وقتی روی input کلیک می کنیم */

      input:focus,
      select:focus {
        border-color: #ffd900;

        box-shadow: 0 0 10px rgba(255, 217, 0, 0.7);
      }

      /* =========================
           دو ستون
        ========================= */

      .two-columns {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 12px;
      }

      /* =========================
           قسمت انتخاب فایل
        ========================= */

      input[type="file"] {
        padding: 8px;

        background: rgba(255, 255, 255, 0.92);
      }

      /* دکمه Choose File */

      input[type="file"]::file-selector-button {
        background-color: red;

        color: white;

        border: none;

        padding: 9px 14px;

        margin-left: 10px;

        border-radius: 8px;

        cursor: pointer;

        font-family: inherit;
      }

      /* هاور دکمه فایل */

      input[type="file"]::file-selector-button:hover {
        background-color: darkred;
      }

      /* =========================
           دکمه ثبت رزرو
        ========================= */

      button {
        width: 100%;

        margin-top: 8px;

        padding: 14px;

        border: none;

        border-radius: 12px;

        background: #ffd900;

        color: #111;

        font-size: 17px;

        font-weight: bold;

        font-family: inherit;

        cursor: pointer;

        transition: 0.3s;
      }

      /* وقتی موس روی دکمه می رود */

      button:hover {
        background: #fff000;

        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(255, 217, 0, 0.35);
      }

      /* =========================
           نسخه موبایل
        ========================= */

      @media (max-width: 700px) {
        .page {
          justify-content: center;

          padding: 20px;
        }

        form {
          width: 100%;

          padding: 22px;
        }

        .two-columns {
          grid-template-columns: 1fr;

          gap: 0;
        }

        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =================================
         تصویر پس زمینه
    ================================== -->

    <img class="background-image" src="hotel2.jpg" alt="هتل آبشار" />

    <!-- لایه روی تصویر -->

    <div class="background-overlay"></div>

    <!-- =================================
         محتوای اصلی
    ================================== -->

    <main class="page">
      <!-- =================================
             فرم رزرو
        ================================== -->

      <form
        action="mailto:shahinteacher5@gmail.com"
        method="post"
        enctype="multipart/form-data"
      >
        <!-- عنوان -->

        <h1>رزرو هتل آبشار</h1>

        <p class="subtitle">لطفاً اطلاعات خود را وارد کنید</p>

        <!-- =================================
                 نام و نام خانوادگی
            ================================== -->

        <div class="two-columns">
          <div class="form-group">
            <label for="first-name"> نام </label>

            <input
              type="text"
              id="first-name"
              name="first-name"
              placeholder="نام خود را وارد کنید"
              required
            />
          </div>

          <div class="form-group">
            <label for="last-name"> نام خانوادگی </label>

            <input
              type="text"
              id="last-name"
              name="last-name"
              placeholder="نام خانوادگی"
              required
            />
          </div>
        </div>

        <!-- =================================
                 ایمیل
            ================================== -->

        <div class="form-group">
          <label for="email"> ایمیل </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </div>

        <!-- =================================
                 شماره تلفن
            ================================== -->

        <div class="form-group">
          <label for="phone"> شماره تلفن </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="09123456789"
            required
          />
        </div>

        <!-- =================================
                 تعداد مهمان
            ================================== -->

        <div class="form-group">
          <label for="guests"> تعداد مهمان </label>

          <input
            type="number"
            id="guests"
            name="guests"
            min="1"
            max="20"
            placeholder="تعداد نفرات"
            required
          />
        </div>

        <!-- =================================
                 تاریخ ورود و خروج
            ================================== -->

        <div class="two-columns">
          <div class="form-group">
            <label for="check-in"> تاریخ ورود </label>

            <input type="date" id="check-in" name="check-in" required />
          </div>

          <div class="form-group">
            <label for="check-out"> تاریخ خروج </label>

            <input type="date" id="check-out" name="check-out" required />
          </div>
        </div>

        <!-- =================================
                 نوع اتاق
            ================================== -->

        <div class="form-group">
          <label for="room-type"> نوع اتاق </label>

          <select id="room-type" name="room-type" required>
            <option value="">انتخاب کنید</option>

            <option value="single">اتاق یک‌نفره</option>

            <option value="double">اتاق دونفره</option>

            <option value="triple">اتاق سه‌نفره</option>

            <option value="suite">سوئیت</option>
          </select>
        </div>

        <!-- =================================
                 آپلود کارت ملی
            ================================== -->

        <div class="form-group">
          <label for="id-image"> تصویر کارت ملی / مدرک شناسایی </label>

          <input type="file" id="id-image" name="id-image" accept="image/*" />
        </div>

        <!-- =================================
                 دکمه ثبت
            ================================== -->

        <button type="submit">ثبت درخواست رزرو</button>
      </form>
    </main>
  </body>
</html>
